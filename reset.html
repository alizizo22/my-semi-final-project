<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rest password</title>
    
    <link rel="stylesheet" href="reset.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="login-container">
        
        
        <section class="visual-section">
           
        </section>

        
        <section class="form-section">
            <div class="form-wrapper">
               
                <div class="brand-logo">
                    <img src="../images/Logo.png" alt="Rihla Egypt Travel">
                </div>

                <header class="form-header">
                    <h1>Reset Password</h1>
                    <p>create anew secure password for your account</p>
                </header>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" placeholder="*******">
                            
                            <span class="hide-password">
                                <img src="../images/Icon.png" alt="Hide Password">
                            </span>
                        </div>
                    </div>
 <div class="input-group">
                        <label for="confirm-password">Confirm Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirm-password" placeholder="******">
                            <span class="hide-password">
                                <img src="../images/Icon.png" alt="hide-password ">
                            </span>
                        </div>
                    </div>
                    <button type="submit" class="reset-password">reset password</button>

</body>
</html>
