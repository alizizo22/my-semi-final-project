<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forgot password</title>
      <link rel="stylesheet" href="/forgot.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
      <main class="login-container">
       
        <section class="visual-section"></section>
        <section class="form-section">
            <div class="form-wrapper">
                
                <div class="brand-logo">
                    <img src="../images/Logo.png" alt="Rihla Egypt Travel">
                </div>

                <header class="form-header">
                    <h1>forgot password</h1>
                    <p>Don't worry! Enter your email and we'll send you a verification code</p>
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Mena@gmail.com">
                    </div>
                    <button type="submit" class="submit-btn">Send verification code</button>
</body>
