<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Website - Verify Account</title>
    <link rel="stylesheet" href="verify.css">
    <!-- استدعاء خطوط جوجل عشان الشكل يكون قريب للديزاين -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- الكارت الأبيض الرئيسي اللي شايل الصفحة كلها -->
    <div class="main-wrapper">
        
        <!-- القسم الشمال: الصورة -->
        <div class="image-section">
            <!-- حط مسار صورتك هنا -->
            <img src="images/Mask group.png" alt="photo">
        </div>

        <!-- القسم اليمين: الفورم -->
        <div class="form-section">
            <!-- الكونتينر الداخلي بناءً على مقاسات فيجما -->
            <div class="verify-container">
                
                <!-- اللوجو -->
                <div class="logo">
                    <!-- حط مسار اللوجو بتاعك هنا -->
                    <img src="images/Logo.png" alt="Rihla Egypt Travel">
                </div>

                <!-- الهيدر والنص -->
                <div class="header-text">
                    <h1>Verify Your Account</h1>
                    <p>Enter the 4-digit code sent to your phone or email</p>
                </div>

                <!-- مربعات الأرقام OTP -->
                <div class="otp-group">
                    <input type="text" maxlength="1" value="2">
                    <input type="text" maxlength="1" value="7">
                    <input type="text" maxlength="1">
                    <input type="text" maxlength="1">
                </div>

                <!-- العداد -->
                <div class="timer">
                    <span>00:58</span>
                </div>

                <!-- الزرار -->
                <button class="verify-btn">send verifcation code</button>

                <!-- إعادة الإرسال -->
                <div class="resend-link">
                    <p>Didn't receive OTP? <a href="#">Send Again</a></p>
                </div>

            </div>
        </div>

    </div>

</body>
</html>
