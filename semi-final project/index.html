<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login-page</title>
    
    <link rel="stylesheet" href="login.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="login-container">
        
        
        <section class="visual-section">
           
        </section>

        
        <section class="form-section">
            <div class="form-wrapper">
               
                <div class="brand-logo">
                    <img src="images/Logo.png" alt="Rihla Egypt Travel">
                </div>

                <header class="form-header">
                    <h1>Welcome Back</h1>
                    <p>Sign in to your account to continue your journey</p>
                </header>

                
                <form action="#" class="login-form">
                    
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Mena@gmail.com">
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" placeholder="*******">
                            
                            <span class="hide-password">
                                <img src="images/Icon.png" alt="Hide Password">
                            </span>
                        </div>
                    </div>

                    <div class="form-actions">
                        <label class="remember-me">
                            <input type="radio" name="remember">
                            
                            <span>Remember me</span>
                        </label>
                        <a href="/task .html/forgot.html" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="submit-btn">Login</button>
                </form>

               
                <div class="divider">
                    <span>Or continue with</span>
                </div>

               
                <div class="social-login">
                    <button type="button" class="social-btn">
                        <img src="images/Icon (1).png" alt="Google">
                        Google
                    </button>
                    <button type="button" class="social-btn">
                        <img src="images/mdi_apple.png" alt="Apple">
                        Apple
                    </button>
                </div>

             
                <footer class="form-footer">
                    <p>Don't have an account? <a href="/task .html/signup.html">Create account</a></p>
                </footer>
                
            </div>
        </section>

    </main>

</body>
</html>
