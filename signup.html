<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign up</title>
    <link rel="stylesheet" href="signup.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="login-container">
       
        <section class="visual-section"></section>
        <section class="form-section">
            <div class="form-wrapper">
                
                <div class="brand-logo">
                    <img src="../images/Logo.png" alt="Rihla Egypt Travel">
                </div>

                <header class="form-header">
                    <h1>Create Account</h1>
                    <p>Join 50,000+ travelers exploring Egypt</p>
                </header>

                <form action="" class="login-form">
                    
                    <div class="input-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" placeholder="Mena">
                    </div>

                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Mena@gmail.com">
                    </div>

                    <div class="input-group">
                    <label for="password">Password</label>
                     <div class="password-wrapper">
                    <input type="password" id="password" placeholder="*******">
                    <span class="hide-password">
                     <img src="../images/Icon.png" alt=" Password">
                    </span>
                     </div>
                    </div>

                    <div class="input-group">
                        <label for="confirm-password">Confirm Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirm-password" placeholder="******">
                            <span class="hide-password">
                                <img src="../images/Icon.png" alt="hide-password ">
                            </span>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">Create Account</button>
                </form>

                <footer class="form-footer">
                    <p>Have an account? <a href="/task .html/login.html">Sign In</a></p>
                </footer>

            </div>
        </section>

    </main>

</body>
</html>
